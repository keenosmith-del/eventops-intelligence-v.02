services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventops
      POSTGRES_USER: eventops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventops}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-n8n.sql:/docker-entrypoint-initdb.d/02-n8n.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventops -d eventops"]
      interval: 5s
      timeout: 5s
      retries: 10
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a}
    ports: ["127.0.0.1:5678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: eventops
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-eventops}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in root .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  n8n_data:
